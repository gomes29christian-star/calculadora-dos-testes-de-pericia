<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Perícias - RPG</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e24;
            color: #f5f5f5;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
        }
        h1, h2 {
            color: #ff9f43;
            text-align: center;
        }
        .container {
            background: #2d2d38;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        .grid-atributos {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: bold;
            margin-bottom: 5px;
            color: #a4b0be;
        }
        input, select {
            padding: 10px;
            background: #3d3d4e;
            border: 1px solid #57606f;
            color: #fff;
            border-radius: 4px;
            font-size: 16px;
        }
        .grid-pericias {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }
        .pericia-card {
            background: #353545;
            padding: 15px;
            border-radius: 6px;
            border-left: 4px solid #ff9f43;
        }
        .pericia-title {
            font-weight: bold;
            color: #fff;
            margin-bottom: 8px;
        }
        .resultado-box {
            margin-top: 10px;
            padding: 8px;
            background: #1e1e24;
            border-radius: 4px;
            font-size: 14px;
        }
        .btn-rolar {
            width: 100%;
            margin-top: 10px;
            padding: 8px;
            background: #ff9f43;
            color: #1e1e24;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-rolar:hover {
            background: #ffb167;
        }
        .critico {
            color: #2ed573;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Automatizador de Testes de Perícia</h1>
    
    <!-- 1. ENTRADA DE ATRIBUTOS -->
    <div class="container">
        <h2>1. Atributos do Personagem</h2>
        <div class="grid-atributos">
            <div class="input-group">
                <label>HPR</label>
                <input type="number" id="attr_HPR" value="1" min="0" onchange="calcularTudo()">
            </div>
            <div class="input-group">
                <label>PRX</label>
                <input type="number" id="attr_PRX" value="1" min="0" onchange="calcularTudo()">
            </div>
            <div class="input-group">
                <label>PSI</label>
                <input type="number" id="attr_PSI" value="1" min="0" onchange="calcularTudo()">
            </div>
            <div class="input-group">
                <label>QI</label>
                <input type="number" id="attr_QI" value="1" min="0" onchange="calcularTudo()">
            </div>
        </div>
    </div>

    <!-- 2. PAINEL DE PERÍCIAS -->
    <div class="container">
        <h2>2. Pontos Puros de Perícia & Rolagens</h2>
        <p style="font-size:12px; color:#a4b0be; text-align:center;">Insira os pontos puros investidos. Selecione as escolhas de atributos onde houver " / ".</p>
        
        <div class="grid-pericias" id="lista-pericias">
            <!-- As perícias serão geradas dinamicamente aqui pelo JavaScript -->
        </div>
    </div>

<script>

];

// Monta o HTML dinâmico na tela
const containerPericias = document.getElementById('lista-pericias');
dadosPericias.forEach(p => {
    let seletorAttr = '';
    // Se a perícia permitir escolher entre mais de um atributo principal
    if(p.baseAttr.length > 1) {
        seletorAttr = `<select id="escolha_${p.nome}" onchange="calcularTudo()">`;
        p.baseAttr.forEach(at => { seletorAttr += `<option value="${at}">${at}</option>`; });
        seletorAttr += `</select>`;
    } else {
        seletorAttr = `<span style="color:#ff9f43; font-weight:bold;">${p.baseAttr[0]}</span>`;
    }

    const card = document.createElement('div');
    card.className = 'pericia-card';
    card.innerHTML = `
        <div class="pericia-title">${p.nome}</div>
        <div style="margin-bottom: 8px; font-size:12px;">Base: ${seletorAttr}</div>
        <div class="input-group">
            <label style="font-size:12px;">Pontos Investidos:</label>
            <input type="number" id="pts_${p.nome}" value="0" min="0" onchange="calcularTudo()">
        </div>
        <div class="resultado-box">
            Bonus Fixo: <span id="fixo_${p.nome}">0</span><br>
            <button class="btn-rolar" onclick="rolarTeste('${p.nome}')">Rolar Dados</button>
            <div id="dados_${p.nome}" style="margin-top:5px; font-size:12px; color:#ff9f43;"></div>
        </div>
    `;
    containerPericias.appendChild(card);
});
